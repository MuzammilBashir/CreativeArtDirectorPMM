      x.forEach(c=>h+=`<tr class=ch data-s=${sec(c.starttime_offset)}><td></td><td class=f>${esc(c.stage)} ${esc(c.starttime_offset)}–${esc(c.endtime_offset)}</td><td>${esc(c.chapter_description)}</td></tr>`);

      Object.entries(x).forEach(([f,y],n)=>h+=`<tr><td class=cat>${n?'':k}</td><td class=f>${f}</td><td>${val(y)}</td></tr>`);
