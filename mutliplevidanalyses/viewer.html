const nav=document.getElementById('nav'),t=document.getElementById('t'),v=document.getElementById('v');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const val=x=>Array.isArray(x)?x.map(i=>`<span class=chip>${esc(i)}</span>`).join(''):esc(x??'');
const sec=s=>{const m=String(s).match(/^(\d+):(\d+)/);return m?+m[1]*60+ +m[2]:0};
function show(i){
  [...nav.children].forEach((a,j)=>a.classList.toggle('on',i==j));
  const a=ADS[i];v.src=a.video;let h='';
  for(const [k,x] of Object.entries(a.data)){
    if(k=='chapterization'){
      h+=`<tr><td class=cat>${k}</td><td class=f colspan=2><i>click a row to seek</i></td></tr>`;
      x.forEach(c=>h+=`<tr class=ch data-s=${sec(c.starttime_offset)}><td></td><td class=f>${esc(c.stage)} ${esc(c.starttime_offset)}–${esc(c.endtime_offset)}</td><td>${esc(c.chapter_description)}</td></tr>`);
    }else if(x&&typeof x=='object'&&!Array.isArray(x)){
      Object.entries(x).forEach(([f,y],n)=>h+=`<tr><td class=cat>${n?'':k}</td><td class=f>${f}</td><td>${val(y)}</td></tr>`);
    }else h+=`<tr><td class=cat>${k}</td><td class=f>${k}</td><td>${val(x)}</td></tr>`;
  }
  t.innerHTML=h;
  t.querySelectorAll('tr.ch').forEach(r=>r.onclick=()=>{v.currentTime=+r.dataset.s;v.play()});
}
ADS.forEach((a,i)=>{const e=document.createElement('a');e.textContent=a.name;e.onclick=()=>show(i);nav.append(e)});
show(0);
